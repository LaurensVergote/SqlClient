# Call from a test/validation job after installing the SDK and restoring local tools.
parameters:
  - name: testResultsPath
    type: string

steps:
  - script: >-
      dotnet tool run pwsh -NoProfile -NonInteractive -Command
      "Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop"
    displayName: Install family-version test prerequisites
    workingDirectory: $(Build.SourcesDirectory)

  - task: PowerShell@2
    displayName: Test installed SqlClient family versions
    inputs:
      targetType: inline
      pwsh: true
      workingDirectory: $(Build.SourcesDirectory)
      script: |
        # Keep the Pester configuration literal across shells; execute with the pinned local tool.
        & dotnet tool run pwsh -NoProfile -NonInteractive -Command @'
        $ErrorActionPreference = 'Stop'
        Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
        $configuration = New-PesterConfiguration
        $configuration.Run.Path = @(
            'src/Microsoft.Data.SqlClient.Internal/Logging/test/VersionChecks.Tests.ps1'
            'eng/pipelines/scripts/tests/VersionCheckPipeline.Tests.ps1'
        )
        $configuration.Run.Exit = $true
        $configuration.Output.Verbosity = 'Normal'
        # The real Logging pack needs repository imports, so the suite owns its scratch directory.
        $configuration.TestDrive.Enabled = $false
        $configuration.TestResult.Enabled = $true
        $configuration.TestResult.OutputFormat = 'NUnitXml'
        $configuration.TestResult.OutputPath = '${{ parameters.testResultsPath }}'
        Invoke-Pester -Configuration $configuration
        '@
        if ($LASTEXITCODE -ne 0) {
            throw "Family-version Pester tests failed with exit code $LASTEXITCODE."
        }

  - task: PublishTestResults@2
    displayName: Publish family-version test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: NUnit
      testResultsFiles: '${{ parameters.testResultsPath }}'
      testRunTitle: SqlClient family-version validation
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
