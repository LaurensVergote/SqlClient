parameters:
  - name: platformDisplayName
    type: string

  - name: poolImage
    type: string

  - name: poolName
    type: string

  - name: testResultsArtifactBaseName
    type: string

jobs:
  - job: "test_${{ parameters.platformDisplayName }}_logging"
    displayName: "logging_${{ parameters.platformDisplayName }}"

    variables:
      - name: testResultsPath
        value: "$(Build.SourcesDirectory)/test_results/${{ parameters.platformDisplayName }}_logging"

    pool:
      name: ${{ parameters.poolName }}
      demands:
        - imageOverride -equals ${{ parameters.poolImage }}

    steps:
      - template: /eng/pipelines/common/steps/install-dotnet.yml@self

      - template: /eng/pipelines/common/steps/restore-dotnet-tools.yml@self

      - template: /eng/pipelines/common/steps/test-family-versions.yml@self
        parameters:
          testResultsPath: '$(testResultsPath)/family-versions.xml'

      - task: PublishPipelineArtifact@1
        displayName: Publish Logging Test Artifacts
        condition: succeededOrFailed()
        inputs:
          artifact: ${{ parameters.testResultsArtifactBaseName }}_$(System.JobId)_attempt$(System.JobAttempt)
          targetPath: $(testResultsPath)
